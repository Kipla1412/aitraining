[project]
name = "aitraining"
version = "0.1.0"
description = "Provider-neutral LLM framework: OpenAI + Gemini providers/parsers emitting common StreamEvents."
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0",
    "httpx>=0.28",
    "openai==3.6.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/tests"]
pythonpath = ["src"]
markers = [
    "integration: live tests that call real LLM APIs and consume tokens",
]
